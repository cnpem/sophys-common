[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "sophys-common"
maintainers = [
  { name="Igor Torquato", email="igor.torquato@lnls.br" },
  { name="Rafael Lyra", email="rafael.lyra@lnls.br" },
  { name="Sofia Ferreira", email="sofia.ferreira@lnls.br" },
]
description = "Common bluesky and ophyd utilities from SIRIUS/LNLS"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
  "bluesky",
  "ophyd",
  "numpy",
  "ophyd-async",
]

[project.optional-dependencies]
dev = [
  "pre-commit",
  "pytest",
  "pytest-cov",
  "pytest-virtualenv",
  "caproto!=1.2.0",
  "pytest-asyncio",
]
kafka = [
  "kafka-python",
  "msgpack",
  "msgpack-numpy"
]
registry = [
  "ophyd-registry"
]
databroker = [
  "databroker"
]
all = [
  "sophys-common[dev,kafka,registry,databroker]"
]

[project.urls]
"Homepage" = "https://gitlab.cnpem.br/SOL/bluesky/sophys-common"
"Bug Tracker" = "https://gitlab.cnpem.br/SOL/bluesky/sophys-common/-/issues"

[tool.setuptools_scm]
version_file = "src/sophys/common/__version__.py"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
exclude = ["__version__.py", "docs/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "N", "B", "UP"]
ignore = ["E203", "E501", "N817"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # Ignore assert warnings in test files

[tool.numpydoc_validation]
checks = ["all", "EX01", "SA01", "ES01", "RT01"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
